[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provguard"
version = "0.1.0"
description = "Controlled provenance-matched hard-negative experiments for PIDS-Bench"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2.2", "scikit-learn>=1.5", "scipy", "matplotlib", "torch>=2.5", "transformers==4.57.1", "datasets==4.4.1", "huggingface-hub==0.36.0", "accelerate>=1.1", "psutil>=5.9", "joblib>=1.3"]

[project.scripts]
provguard = "provguard.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
paper = ["PyMuPDF>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
